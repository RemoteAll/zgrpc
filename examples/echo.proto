// zgrpc 代码生成示例（proto3 子集）
//
// 生成：zig run tools/proto_gen.zig -- examples/echo.proto examples/echo.pb.zig
syntax = "proto3";

package echo;

// 与 examples/grpc_echo_server.zig 的 /echo.Echo/Bump 对应
message BumpRequest {
  int32 value = 1;
  string tag = 2;
}

message BumpResponse {
  int32 value = 1;
  string tag = 2;
  uint64 calls = 3;
}

enum Status {
  UNKNOWN = 0;
  OK = 1;
  FAILED = 2;
}

// 复杂一点的：嵌套 message + 枚举 + repeated
message Summary {
  string note = 1;
  Status status = 2;
  BumpResponse last = 3;
  repeated int32 samples = 4;
  repeated uint64 counters = 5;
  bool done = 6;
  double ratio = 7;
  // repeated 非标量：string / message（生成 []const []const u8 / []const T）
  repeated string tags = 8;
  repeated BumpResponse items = 9;
  repeated Status states = 10;
  // map：生成 []const XxxEntry（零依赖，另带 get<Field> 线性查找辅助）
  map<string, int32> counts = 11;
  map<int32, BumpResponse> by_id = 12;
  // oneof：生成 Zig tagged union（同时只能有一个成员）
  oneof payload {
    string text = 13;
    BumpResponse rich = 14;
  }
  // proto3 optional：显式 presence（生成 ?T，默认值也写）
  optional int32 opt_value = 15;
  optional string opt_name = 16;
}

service Echo {
  rpc Say(BumpRequest) returns (BumpResponse);
  rpc Chat(stream BumpRequest) returns (stream BumpResponse);
}

// 嵌套定义：Zig 里生成嵌套声明，引用写 `Container.Nested`
message Container {
  message Nested {
    enum Level {
      LOW = 0;
      HIGH = 1;
    }
    int32 x = 1;
    Level level = 2;
  }
  Nested nested = 1;
  Nested.Level level = 2;
  repeated Nested items = 3;
}
